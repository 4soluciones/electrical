{% extends 'home.html' %}

{% block title %}
    Listado de Compras
{% endblock title %}

{% block body %}

    <div class="card m-1 border-primary">
        <div id="purchase-grid-list">{% include "buys/purchase_grid_list.html" %}</div>
        <div class="modal fade" id="assignment" tabindex="-1" role="dialog" aria-labelledby="ModalHelpTitle"
             aria-hidden="true"></div>
    </div>
{% endblock body %}

{% block extrajs %}

    <script type="text/javascript">

        $('#puchase-data-grid').DataTable({
            "language": {
                "url": "//cdn.datatables.net/plug-ins/1.10.15/i18n/Spanish.json"
            },
            "order": [[3, "desc"]]
        });

        /* El modal de asignacion se abre con UNA sola llamada a show() y con el contenido ya
           dentro. Antes se abria primero con un spinner y luego se reinyectaba el html, lo que
           rompia por las trampas de Bootstrap 4.3.1:
             1) show() cachea this._dialog = querySelector('.modal-dialog') y hace
                $(document).on('focusin.bs.modal'). Reemplazar el innerHTML del .modal deja ese
                nodo huerfano (hide() animaba un elemento desconectado, por eso la X y el boton
                Cerrar no hacian nada) y deja el foco atrapado.
             2) modal('dispose') NO retira el .modal-backdrop del DOM, solo pone this._backdrop
                = null, y ademas hace $(document).off('focusin.bs.modal'): la pantalla queda
                oscura e inservible.
             3) show()/hide() tienen guarda _isTransitioning. La clase .show no se escribe hasta
                que termina el fade del backdrop (~150 ms) y _isTransitioning dura ~450 ms, asi
                que decidir con hasClass('show') es una carrera: con el servidor rapido la
                respuesta entra DENTRO de esa ventana y se tomaba la rama equivocada.
           Con un unico show() no hay ninguna de las tres: no hace falta dispose(), _dialog nunca
           queda huerfano y el aviso de carga se muestra con toastr, no con un modal aparte. */
        function openAssignmentModal(html) {
            $('#assignment').html(html).modal('show');
        }

        /* Red de seguridad: si quedara algun .modal-backdrop huerfano (por un excepcion de
           Bootstrap o por un .show anulado), la pagina quedaria oscura y sin poder hacer clic.
           Se limpia en cuanto no queda ningun modal abierto. */
        $(document).on('shown.bs.modal hidden.bs.modal', function () {
            if ($('.modal.show').length === 0) {
                if ($('.modal-backdrop').length) {
                    $('.modal-backdrop').remove();
                }
                $('body').removeClass('modal-open').css('overflow', '');
            }
        });

        $(document).on('click', '.assignment-store', function () {
            let search = $(this).attr('pk');
            let $button = $(this).prop('disabled', true);
            toastr.info('Cargando detalle de la compra...', 'ESPERE');

            $.ajax({
                url: '/buys/get_detail_purchase_store/',
                dataType: 'json',
                type: 'GET',
                data: {
                    'pk': search,
                    'type_change': $('#type_change_value').val(),
                },

                contentType: 'application/json;charset=UTF-8',
                headers: {"X-CSRFToken": '{{ csrf_token }}'},
                success: function (response, textStatus, xhr) {
                    if (xhr.status === 200 && response && response.form) {
                        openAssignmentModal(response.form);
                    } else {
                        toastr.error('NO SE PUDO OBTENER EL DETALLE DE LA COMPRA.', '¡MENSAJE!');
                    }
                },
                error: function (jqXhr, textStatus, xhr) {
                    $('#assignment').modal('hide');
                    if (jqXhr.responseJSON && jqXhr.responseJSON.detalle) {
                        toastr.error(jqXhr.responseJSON.detalle, '¡MENSAJE!');
                    } else {
                        toastr.error('NO SE PUDO OBTENER EL DETALLE DE LA COMPRA.', '¡MENSAJE!');
                    }
                },
                complete: function () {
                    $button.prop('disabled', false);
                }
            });
        });

        /*Boton anular*/
        $(document).on('click', '.btn-annular', function () {
            let search = $(this).attr('pk');
            let mensaje = confirm(
                "¿Esta seguro de anular la compra?\n\n" +
                "Al anularla se ELIMINARÁN las series registradas en ella, para que puedan " +
                "reutilizarse sin generar duplicados.\n\n" +
                "La operación no se puede deshacer."
            );
            if (mensaje) {
                $.ajax({
                    url: '/buys/update_state_annular_purchase/',
                    dataType: 'json',
                    type: 'GET',
                    data: {'pk': search},
                    success: function (response) {
                        toastr.success(response.message, '¡COMPRA ANULADA CORRECTAMENTE!');
                        setTimeout(() => {
                            location.reload();
                        }, 800);
                    },
                    error: function (jqXHR) {
                        if (jqXHR.responseJSON && jqXHR.responseJSON.error) {
                            toastr.error(jqXHR.responseJSON.error, '¡NO SE PUDO ANULAR!');
                        } else {
                            toastr.error('ERROR AL ANULAR LA COMPRA.', '¡CONTACTE CON SISTEMAS!');
                        }
                    }
                });
            }
        });

        $(document).on('click', '.btn-update', function () {
            let _purchase = $(this).attr('pk');
            let mensaje = confirm("¿Editar la compra seleccionada?");
            if (mensaje) {
                window.open("/buys/update_purchase/" + _purchase + "/", '_blank');
            }
        });

        $(document).on('click', '#btn-type-change', function (e) {
            let _input_type_change = $('#type_change')
            let _input_type_change_value = $('#type_change_value')

            $.ajax({
                url: '/buys/get_type_change/',
                async: true,
                dataType: 'json', // for response
                type: 'GET',
                data: {},
                contentType: 'application/json;charset=UTF-8',
                headers: {"X-CSRFToken": '{{ csrf_token }}'},
                success: function (response, textStatus, xhr) {
                    if (xhr.status === 200) {
                        _input_type_change.val('$ ' + response.buy);
                        _input_type_change_value.val(response.buy);
                    }
                },
                error: function (jqXhr, textStatus, xhr) {
                    if (jqXhr.status === 500) {
                        toastr.error(jqXhr.responseJSON.error, 'Mensaje');
                    } else {
                        if (textStatus === 'timeout') {
                            toastr.error('Failed from timeout', 'Mensaje');
                        } else {
                            console.log(" STATUS: " + xhr + " " + textStatus);
                        }
                    }
                },
            });
            return false;
        });
        $("#btn-type-change").trigger('click');

    </script>
{% endblock extrajs %}
