<form id="purchase-form" action="{% url 'buys:save_purchase' %}" method="POST" autocomplete="off">
    {% csrf_token %}

    {# ================= FILA 1: PROVEEDOR + DOCUMENTO ================= #}
    <div class="oc-row">
        <div class="oc-cell oc-cell--2">
            <label for="id_ruc_provider">RUC <b>*</b></label>
            <div class="oc-input oc-input--icon">
                <i class="fas fa-id-card oc-input__icon"></i>
                <input type="text" class="form-control text-uppercase" id="id_ruc_provider"
                       name="ruc_provider"
                       placeholder="RUC"
                       size="11"
                       maxlength="11"
                       value="" required>
            </div>
            <small class="oc-hint">Enter para buscar</small>
        </div>

        <div class="oc-cell oc-cell--3">
            <label for="id_provider">Proveedor <b>*</b></label>
            <div class="oc-input oc-input--icon">
                <i class="fas fa-building oc-input__icon"></i>
                <input type="text" class="form-control text-uppercase" provider="" id="id_provider"
                       name="provide"
                       placeholder="Razón social"
                       value="" required>
            </div>
            <small class="oc-hint" id="provider-hint">Se completa al buscar el RUC</small>
        </div>

        <div class="oc-cell oc-cell--2">
            <label for="id_fechacompra">Fecha <b>*</b></label>
            <div class="oc-input oc-input--icon">
                <i class="far fa-calendar oc-input__icon"></i>
                <input type="date" class="form-control" id="id_fechacompra"
                       name="fechacompra"
                       placeholder="Fecha compra"
                       value="{{ formatdate }}" required>
            </div>
        </div>

        <div class="oc-cell oc-cell--2">
            <label for="id_type_bill">Tipo doc.</label>
            <div class="oc-input">
                <select id="id_type_bill" name="type_bill" class="form-control">
                    <option value="T">TICKET</option>
                    <option value="B">BOLETA</option>
                    <option selected value="F">FACTURA</option>
                </select>
            </div>
        </div>

        <div class="oc-cell oc-cell--3">
            <label for="id_factura">Nº de documento <b>*</b></label>
            <div class="oc-input oc-input--icon">
                <i class="fas fa-hashtag oc-input__icon"></i>
                <input type="text" class="form-control text-uppercase" id="id_factura"
                       name="factura"
                       placeholder="F001-000123"
                       value="" required>
            </div>
        </div>
    </div>

    {# ================= FILA 2: PAGO + CONTEXTO + ACCIONES ================= #}
    <div class="oc-row oc-row--pago">
        <div class="oc-cell oc-cell--pay">
            <label for="payment_type">Tipo de pago</label>
            <div class="oc-input">
                <select id="payment_type" class="form-control text-uppercase">
                    <option value="0">Seleccione</option>
                    {% for item in choices_payments_purchase %}
                        <option value="{{ item.0 }}">{{ item.1 }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="oc-cell oc-cell--dues dues d-none">
            <label for="amount-due">Monto de la cuota</label>
            <div class="input-group">
                <input type="number" step="0.01" class="form-control text-right" placeholder="0.00"
                       aria-label="Monto de la cuota" aria-describedby="add-dues" id="amount-due">
                <div class="input-group-append">
                    <button class="btn oc-btn-add" type="button" id="add-dues" title="Agregar cuota">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="oc-cell oc-cell--ctx">
            <label for="id_user">Responsable</label>
            <div class="oc-input oc-input--icon">
                <i class="fas fa-user-tie oc-input__icon"></i>
                <input type="text" class="form-control" id="id_user"
                       name="user"
                       placeholder="" readonly
                       value="{{ user.worker_set.last.employee.paternal_last_name|upper }}">
            </div>
        </div>

        <div class="oc-cell oc-cell--ctx">
            <label for="id_user_branch">Sucursal</label>
            <div class="oc-input oc-input--icon">
                <i class="fas fa-building oc-input__icon"></i>
                <input type="text" class="form-control" id="id_user_branch"
                       name="user_branch"
                       placeholder="" readonly
                       value="{{ user.worker_set.last.establishment_set.last.subsidiary.name|upper }}">
            </div>
        </div>

        <div class="oc-cell oc-cell--actions">
            <button type="button" id="btn-new" class="oc-btn oc-btn--white" title="Limpiar el formulario">
                <i class="fas fa-eraser"></i> Limpiar
            </button>
            <button type="submit" id="btn-save" class="oc-btn oc-btn--primary" title="Registrar la compra">
                <i class="fas fa-check-circle"></i> Guardar Compra
            </button>
        </div>
    </div>

    <div class="row p-2 table-dues d-none">
        <div class="col-12">
            <div class="oc-subcard">
                <div class="oc-subcard__head">
                    <h3 class="oc-subcard__title"><i class="fas fa-calendar-alt"></i> Plan de cuotas / letras</h3>
                </div>
                <div class="table-responsive">
                    <table id="id_debs_grid" class="table oc-table align-middle mb-0" cellspacing="0">
                        <thead class="oc-thead">
                        <tr>
                            <th scope="col" class="oc-th oc-th--pct">Nº cuota</th>
                            <th scope="col" class="oc-th">Monto</th>
                            <th scope="col" class="oc-th oc-th--act">Eliminar</th>
                        </tr>
                        </thead>
                        <tbody id="details-dues">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</form>
